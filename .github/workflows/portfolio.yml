name: CI/CD Portfolio Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
   
    environment: portfolio-secret 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portfolio-site:latest

  deploy-to-vm:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: portfolio-secret
    steps:
      - name: SSH into VM and Update Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/portfolio-site:latest
            # Ensure this path matches the location of your docker-compose.yml on your VM
            cd ~/portfolio 
            docker-compose up -d
            docker image prune -f
